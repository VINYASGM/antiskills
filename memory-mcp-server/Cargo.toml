[package]
name = "memory-mcp-server"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async runtime & Channels
tokio = { version = "1.36", features = ["full"] }
crossbeam-channel = "0.5"
rayon = "1.10"

# Filesystem Events
notify = "6.1"

# Database
rusqlite = { version = "0.31", features = ["bundled", "vtab"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"

# ML Pipeline (ONNX & Parsing)
ort = { version = "2.0.0-rc.2", features = ["directml", "coreml", "cuda", "download-binaries"] }
tree-sitter = "0.22"
tree-sitter-rust = "0.21"
tokenizers = "0.19"
ndarray = "0.17.2"

# JSON-RPC & Serde
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
